[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jig"
description = "Compile your agent once with a frontier model. Run it forever on a small one."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ali Hamza Kamboh", email = "123060177+ahkamboh@users.noreply.github.com" }]
requires-python = ">=3.9"
keywords = ["llm", "agents", "small-language-models", "constrained-decoding",
            "structured-output", "workflow", "local-llm", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Deliberately empty, and load-bearing. A pack has to run on a client's own box, and
# "python3 -m jig" must work there without a wheel-build toolchain, a resolver, or a
# CUDA-adjacent dependency tree. docs/ARCHITECTURE.md §7.2 sizes the whole runtime around this.
# tests/production/test_packaging.py fails the build if anything is ever added here.
dependencies = []

# The version lives in exactly one place: jig/__init__.py.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ahkamboh/jig"
Repository = "https://github.com/ahkamboh/jig"
Issues = "https://github.com/ahkamboh/jig/issues"

[project.scripts]
jig = "jig.cli:main"

[tool.setuptools]
# Explicit rather than auto-discovered: tests/ and examples/ ship in the sdist (they are
# how you check a release actually works) but must never land in site-packages.
packages = ["jig", "jig.backends"]

[tool.setuptools.dynamic]
version = { attr = "jig.__version__" }

[tool.setuptools.package-data]
jig = ["py.typed"]
